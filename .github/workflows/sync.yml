name: Sync from Google Sheet

on:
  # 5am Sydney all year. Cron runs in UTC, so both candidate times are scheduled and the
  # "when" job below lets only the one matching Sydney's current offset sync.
  schedule:
    - cron: "0 18 * * *" # 5am Sydney during daylight saving (UTC+11)
    - cron: "0 19 * * *" # 5am Sydney in winter (UTC+10)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check it's 5am in Sydney
        id: check
        run: |
          offset=$(TZ=Australia/Sydney date +%z)
          case "${{ github.event_name }}|${{ github.event.schedule }}|$offset" in
            workflow_dispatch*|*"0 18 * * *|+1100"|*"0 19 * * *|+1000") echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Skipping: this schedule isn't 5am in Sydney today (offset $offset)." ;;
          esac

  sync:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow anthropic google-auth requests
      - name: Fill empty flower colours from their photos
        # Asks Claude for the colour of each flower with a photo but no colour, and writes it into the sheet.
        # Does nothing until both secrets exist; a failure here never stops the sync.
        continue-on-error: true
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python fill_colours.py
      - name: Pull each sheet tab into its page and thumbnails
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python sync.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flower-inventory juju-inventory photos
          git diff --cached --quiet || { git commit -m "Sync from Google Sheet" && git push; }
