name: Sync from Google Sheet

on:
  # Scheduled for 3:17am Sydney all year: GitHub starts scheduled runs late (2-5 hours at the top of the
  # hour), so an early, off-the-hour time lands nearer 5am. Cron runs in UTC, so both candidate times are
  # scheduled and the "when" job below lets only the one matching Sydney's current offset sync.
  schedule:
    - cron: "17 16 * * *" # 3:17am Sydney during daylight saving (UTC+11)
    - cron: "17 17 * * *" # 3:17am Sydney in winter (UTC+10)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  when:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check this is the 3:17am Sydney schedule
        id: check
        run: |
          offset=$(TZ=Australia/Sydney date +%z)
          case "${{ github.event_name }}|${{ github.event.schedule }}|$offset" in
            workflow_dispatch*|*"17 16 * * *|+1100"|*"17 17 * * *|+1000") echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Skipping: this schedule isn't 3:17am in Sydney today (offset $offset)." ;;
          esac

  sync:
    needs: when
    if: needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Pull each sheet tab into its page and thumbnails
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python sync.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flower-inventory juju-inventory photos
          git diff --cached --quiet || { git commit -m "Sync from Google Sheet" && git push; }
