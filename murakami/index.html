<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Murakami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<link rel="icon" href="../shared/icons/favicon.ico" sizes="any">
<link rel="icon" href="../shared/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../shared/icons/apple-touch-icon.png">
<style>
:root{
  color-scheme:light;
  --bg:#F4F6F1; --surface:#FFFFFF; --sunk:#EBEFE7; --ink:#1E2620; --muted:#5D6A61; --line:#DCE2D8; --accent:#7B2E63;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121613; --surface:#1A201C; --sunk:#151A16; --ink:#E7ECE5; --muted:#A0ACA3; --line:#2C352F; --accent:#DE93C4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121613; --surface:#1A201C; --sunk:#151A16; --ink:#E7ECE5; --muted:#A0ACA3; --line:#2C352F; --accent:#DE93C4;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px}
.wrap{max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 32px) 0 48px}
.top{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 10px;margin-bottom:20px}
h1{font:400 clamp(30px,5vw,44px)/1.05 var(--display);margin:0;letter-spacing:-.01em}
.nav{font-size:14px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--surface);white-space:nowrap}
.nav:hover{background:var(--sunk)}
.sub{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}}
.tile{display:block;width:100%;aspect-ratio:1;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--sunk);cursor:zoom-in}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.sample{display:grid;place-items:center;width:100%;height:100%;color:#fff;font:400 clamp(18px,4vw,28px)/1 var(--display);text-shadow:0 1px 3px rgba(0,0,0,.25)}
dialog{border:0;padding:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh;background:rgba(10,12,10,.92)}
dialog::backdrop{background:transparent}
dialog form{width:100%;height:100%;margin:0;display:grid;place-items:center;padding:16px}
dialog img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
dialog button{all:unset;position:fixed;inset:0;cursor:zoom-out}
.close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;color:#fff;font-size:28px;line-height:1;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Murakami</h1>
    <a class="nav" href="../flower-inventory/">Flowers</a>
    <a class="nav" href="../juju-inventory/">Jujus</a>
    <a class="nav" href="../cj-money/">CJ Money</a>
    <p class="sub" id="sub"></p>
  </header>
  <ul class="grid" id="grid"></ul>
</div>
<dialog id="viewer"><form method="dialog"><img id="big" alt=""><button aria-label="Close"></button><span class="close" aria-hidden="true">×</span></form></dialog>

<script type="application/json" id="sheet-data">{"rows": [], "photos": {}}</script>
<script>
// Rows and high-resolution photos come from the sheet's murakami tab (see sync.py); thumbnails from images.json.
// Until the tab has photos, numbered sample squares show what the grid looks like.
const DATA = JSON.parse(document.getElementById('sheet-data').textContent);
const grid = document.getElementById('grid'), viewer = document.getElementById('viewer'), big = document.getElementById('big');
const keys = Object.keys(DATA.photos || {}).sort((a, b) => a - b);

function tile(inner, full) {
  const li = document.createElement('li'), b = document.createElement('button');
  b.className = 'tile';
  b.type = 'button';
  b.append(inner);
  if (full) b.addEventListener('click', () => { big.src = full; viewer.showModal(); });
  else b.style.cursor = 'default';
  li.append(b);
  grid.append(li);
}

if (keys.length) {
  document.getElementById('sub').textContent = `${keys.length} photo${keys.length === 1 ? '' : 's'}`;
  const imgs = {};
  for (const k of keys) {
    const img = document.createElement('img');
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    imgs[k] = img;
    tile(img, '../' + DATA.photos[k].src);
  }
  // Thumbnails load as one file; any tile without one falls back to its high-resolution photo.
  fetch('images.json').then(r => r.ok ? r.json() : {}, () => ({})).then(thumbs => {
    for (const k of keys) imgs[k].src = thumbs[k] || '../' + DATA.photos[k].src;
  });
} else {
  document.getElementById('sub').textContent = 'Sample squares: photos from the sheet’s murakami tab will go here.';
  const hues = [340, 20, 48, 120, 190, 220, 270, 300];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('span'), h = hues[i % hues.length];
    s.className = 'sample';
    s.style.background = `linear-gradient(135deg, hsl(${h} 75% 62%), hsl(${(h + 40) % 360} 70% 48%))`;
    s.textContent = i + 1;
    tile(s);
  }
}
viewer.addEventListener('close', () => big.removeAttribute('src'));
</script>
</body>
</html>
