<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dezza's Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F6F1; --surface:#FFFFFF; --sunk:#EBEFE7; --ink:#1E2620; --muted:#5D6A61; --line:#DCE2D8; --accent:#7B2E63;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121613; --surface:#1A201C; --sunk:#151A16; --ink:#E7ECE5; --muted:#A0ACA3; --line:#2C352F; --accent:#DE93C4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121613; --surface:#1A201C; --sunk:#151A16; --ink:#E7ECE5; --muted:#A0ACA3; --line:#2C352F; --accent:#DE93C4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 0 48px}
h1{font:400 clamp(30px,5vw,44px)/1.05 var(--display);margin:0 0 24px;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
a.card:hover{background:var(--sunk)}
a.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.name{font:400 22px/1.2 var(--display)}
.desc{display:block;margin-top:2px;font-size:14px;color:var(--muted)}
.arrow{color:var(--accent);font-size:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dezza's Pages</h1>
  <p class="eyebrow">CJ Hendry</p>
  <ul>
    <li><a class="card" href="flower-inventory/"><span><span class="name">Flowers</span><span class="desc">Flower inventory</span></span><span class="arrow" aria-hidden="true">→</span></a></li>
    <li><a class="card" href="juju-inventory/"><span><span class="name">Jujus</span><span class="desc">Juju inventory</span></span><span class="arrow" aria-hidden="true">→</span></a></li>
    <li><a class="card" href="cj-money/"><span><span class="name">Money</span><span class="desc">Income, expenses and profit</span></span><span class="arrow" aria-hidden="true">→</span></a></li>
  </ul>
  <p class="eyebrow">Other</p>
  <ul>
    <li><a class="card" href="gym/"><span class="name">Gym</span><span class="arrow" aria-hidden="true">→</span></a></li>
    <li><a class="card" href="rewards/"><span class="name">Rewards</span><span class="arrow" aria-hidden="true">→</span></a></li>
  </ul>
</div>
</body>
</html>
