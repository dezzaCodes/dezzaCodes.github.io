/* The photo grid, in place of the other pages' table. */
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}}
.tile{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--sunk);cursor:zoom-in}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
/* From along the top of each tile, the description along the bottom. */
.tile .from,.tile .desc{position:absolute;left:0;right:0;padding:6px 8px;color:#fff;font:600 12px/1.25 var(--body);text-align:left;text-shadow:0 1px 2px rgba(0,0,0,.5);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tile .from{top:0;background:linear-gradient(rgba(0,0,0,.55),transparent);letter-spacing:.04em}
.tile .desc{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));font-weight:500;padding-top:14px}
@media (min-width:640px){.tile .from,.tile .desc{font-size:14px;padding:8px 10px}}
.empty{color:var(--muted);padding:24px 0}
/* Full-screen photo, with what's in it underneath. */
dialog{border:0;padding:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh;background:rgba(10,12,10,.92)}
dialog::backdrop{background:transparent}
dialog form{width:100%;height:100%;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
dialog img{flex:0 1 auto;min-height:0;max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
.details{flex:none;margin:0;max-width:640px;color:#fff;font:500 18px/1.45 var(--body);text-align:center;white-space:pre-line}
.details b{display:block;font-size:14px;letter-spacing:.06em;opacity:.75;margin-bottom:2px}
.details .colour{display:block;font-size:15px;opacity:.75;margin-top:4px}
dialog button{all:unset;position:fixed;inset:0;cursor:zoom-out}
.close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;color:#fff;font-size:28px;line-height:1;pointer-events:none}
</style>

<script>
// Rows come from the sheet's eyes tab (headings in its top row: from, image, description, colour; see TABS in
// sync.py), with each row's high-resolution photo in DATA.photos, its thumbnail in images.json and its petal colour
// ([name, group], measured by the sync unless typed in the colour column) in DATA.colours, all keyed by row.
const DATA = JSON.parse(document.getElementById('sheet-data').textContent);
const col = name => (DATA.columns || []).findIndex(c => String(c).trim().toLowerCase() === name);
const FROM = col('from'), DESC = col('description');
const sentence = s => s.charAt(0).toUpperCase() + s.slice(1);
// A From cell can name several places, separated by commas or semicolons. Each is shown as typed in the sheet;
// the same place typed with different capitals is spelled the way it first appears, so it's one filter.
const spelling = {};
const places = s => [...new Set(s.split(/[,;\n]+/).map(p => p.trim()).filter(Boolean)
  .map(p => spelling[p.toLowerCase()] ??= p))];
const items = (DATA.rows || []).map((r, i) => {
  const from = places(FROM >= 0 ? String(r[FROM] || '') : '');
  const desc = sentence(DESC >= 0 ? String(r[DESC] || '').trim() : '');
  const [colour, group] = DATA.colours?.[i] || ['', ''];
  return { i, from, desc, colour, group, hay: [...from, desc, colour, group].join(' ').toLowerCase() };
});

const $ = id => document.getElementById(id);
const grid = $('grid'), viewer = $('viewer'), big = $('big'), details = $('details');
const el = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; e.append(...kids); return e; };
const photo = it => DATA.photos?.[it.i] ? '../' + DATA.photos[it.i].src : '';

for (const it of items) {
  const b = el('button', 'tile');
  b.type = 'button';
  it.img = el('img');
  it.img.alt = it.desc || it.from.join(', ');
  it.img.loading = 'lazy';
  it.img.decoding = 'async';
  it.img.hidden = true;  // until it has a photo
  b.append(it.img);
  if (it.from.length) b.append(el('span', 'from', it.from.join(' · ')));
  if (it.desc) b.append(el('span', 'desc', it.desc));
  b.addEventListener('click', () => {
    const src = photo(it) || it.img.src;
    if (src) big.src = src; else big.removeAttribute('src');
    details.replaceChildren();
    if (it.from.length) details.append(el('b', '', it.from.join(' · ')));
    if (it.desc) details.append(it.desc);
    if (it.colour) details.append(el('span', 'colour', it.colour));
    details.hidden = !it.from.length && !it.desc && !it.colour;
    viewer.showModal();
  });
  it.li = el('li', '', b);
  grid.append(it.li);
}

// ---------- filters ----------
// The side panel, as on the other pages: a tick list per column. Within a column an eye matching any ticked value
// shows; across columns it has to match each. Counts show how many would match with the other filters as they are.
const SWATCH = { Red: '#D2353B', Orange: '#F08A35', Yellow: '#F3CB45', Green: '#4C9A58', Blue: '#4B80D2', Purple: '#8B5CC4',
  Pink: '#EC86B0', White: '#FFFFFF', Black: '#222222', Brown: '#7B5535', Grey: '#9A9A9A' };
const groupOrder = DATA.colourGroups || [];
const FACETS = [
  { name: 'Colour', of: it => it.group ? [it.group] : [], swatch: true,
    order: (a, b) => (groupOrder.indexOf(a) + 1 || 99) - (groupOrder.indexOf(b) + 1 || 99) || a.localeCompare(b) },
  { name: 'From', of: it => it.from, order: (a, b) => a.localeCompare(b) },
];
const q = $('q');
let words = [];
const passes = (it, skip) => words.every(w => it.hay.includes(w))
  && FACETS.every(f => f === skip || !f.sel.size || f.of(it).some(v => f.sel.has(v)));

for (const f of FACETS) {
  f.sel = new Set();
  f.items = new Map();
  const values = [...new Set(items.flatMap(f.of))].sort(f.order);
  if (!values.length) continue;
  const list = el('div', 'opts');
  values.forEach((v, k) => {
    const cb = el('input');
    cb.type = 'checkbox';
    cb.id = `f-${f.name}-${k}`;
    cb.addEventListener('change', () => { cb.checked ? f.sel.add(v) : f.sel.delete(v); update(); });
    const label = el('span', '');
    if (f.swatch) { const s = el('span', 'swatch'); s.style.background = SWATCH[v] || '#ccc'; label.append(s); }
    label.append(v);
    const count = el('span', 'c');
    const opt = el('label', 'opt', cb, label, count);
    opt.htmlFor = cb.id;
    list.append(opt);
    f.items.set(v, { opt, cb, count });
  });
  f.nSel = el('span', 'n-sel');
  f.clear = el('button', 'linkbtn clear', 'Clear');
  f.clear.type = 'button';
  f.clear.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); f.sel.clear(); update(); });
  const det = el('details', 'facet', el('summary', '', el('span', 'name', f.name), f.nSel, f.clear), list);
  det.open = true;
  $('facets').append(det);
}
$('clearAll').addEventListener('click', () => { FACETS.forEach(f => f.sel.clear()); update(); });

// Phones: the Filters button opens the panel; × and Show … close it and bring the photos into view.
const filtersEl = $('filters'), showFilters = $('showFilters');
showFilters.addEventListener('click', () => { filtersEl.classList.add('open'); update(); });
const closeFilters = () => {
  filtersEl.classList.remove('open');
  update();
  const top = $('toolbar').getBoundingClientRect().top;
  if (top < 0) window.scrollTo({ top: window.scrollY + top - 12 });
};
$('closeFilters').addEventListener('click', closeFilters);
$('doneFilters').addEventListener('click', closeFilters);

let qTimer;
q.addEventListener('input', () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean); update(); }, 120);
});

function update() {
  let shown = 0;
  for (const it of items) { const ok = passes(it); it.li.hidden = !ok; shown += ok; }
  let n = 0;
  const chips = [];
  for (const f of FACETS) {
    const counts = new Map();
    items.forEach(it => { if (passes(it, f)) f.of(it).forEach(v => counts.set(v, (counts.get(v) || 0) + 1)); });
    f.items.forEach((x, v) => {
      const c = counts.get(v) || 0;
      x.count.textContent = c;
      x.cb.checked = f.sel.has(v);
      x.opt.classList.toggle('zero', !c && !f.sel.has(v));
    });
    if (f.nSel) { f.nSel.hidden = f.clear.hidden = !f.sel.size; f.nSel.textContent = f.sel.size; }
    n += f.sel.size;
    for (const v of f.sel) {
      const chip = el('button', 'chip', el('span', '', f.name + ':'), v, el('i', '', '×'));
      chip.type = 'button';
      chip.setAttribute('aria-label', `Remove filter ${f.name}: ${v}`);
      chip.addEventListener('click', () => { f.sel.delete(v); update(); });
      chips.push(chip);
    }
  }
  $('activeFilters').replaceChildren(...chips);
  $('activeFilters').hidden = !chips.length;
  $('clearAll').hidden = !n;
  showFilters.hidden = filtersEl.classList.contains('open');
  showFilters.textContent = `Filters${n ? ` (${n})` : ''}`;
  $('doneFilters').textContent = `Show ${shown} ${shown === 1 ? 'eye' : 'eyes'}`;
  $('empty').hidden = shown > 0 || !items.length;
  const b = s => el('b', '', String(s));
  $('bar').replaceChildren(...(items.length ? ['Showing ', b(shown), ' of ', b(items.length), ' eyes'] : []));
  $('sub').textContent = items.length ? '' : 'No eyes yet: they come from the sheet’s eyes tab.';
  $('sub').hidden = !!items.length;
}
update();

// Thumbnails load as one file; any tile without one falls back to its high-resolution photo.
fetch('images.json').then(r => r.ok ? r.json() : {}, () => ({})).then(thumbs => {
  for (const it of items) { const src = thumbs[it.i] || photo(it); if (src) { it.img.src = src; it.img.hidden = false; } }
});
viewer.addEventListener('close', () => big.removeAttribute('src'));
</script>
