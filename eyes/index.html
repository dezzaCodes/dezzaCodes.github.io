:root{
  color-scheme:light;
  --bg:#F4F6F1; --surface:#FFFFFF; --sunk:#EBEFE7; --ink:#1E2620; --muted:#5D6A61; --line:#DCE2D8; --accent:#7B2E63;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121613; --surface:#1A201C; --sunk:#151A16; --ink:#E7ECE5; --muted:#A0ACA3; --line:#2C352F; --accent:#DE93C4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121613; --surface:#1A201C; --sunk:#151A16; --ink:#E7ECE5; --muted:#A0ACA3; --line:#2C352F; --accent:#DE93C4;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:0 16px}
.wrap{max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 32px) 0 48px}
.top{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 10px;margin-bottom:20px}
h1{font:400 clamp(30px,5vw,44px)/1.05 var(--display);margin:0;letter-spacing:-.01em}
.nav{font-size:14px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:var(--surface);white-space:nowrap}
.nav:hover{background:var(--sunk)}
.nav.icon{font-size:17px;line-height:1.2;padding:3px 10px}
.nav[aria-current]{background:var(--sunk);border-color:var(--accent)}
.sub{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}}
.tile{display:block;width:100%;aspect-ratio:1;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--sunk);cursor:zoom-in}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
dialog{border:0;padding:0;max-width:100vw;max-height:100vh;width:100vw;height:100vh;background:rgba(10,12,10,.92)}
dialog::backdrop{background:transparent}
dialog form{width:100%;height:100%;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 48px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
dialog img{flex:0 1 auto;min-height:0;max-width:100%;max-height:100%;object-fit:contain;border-radius:4px}
/* What's in the photo, from the row under it in the sheet. */
.details{flex:none;margin:0;max-width:640px;color:#fff;font:500 18px/1.45 var(--body);text-align:center;white-space:pre-line}
dialog button{all:unset;position:fixed;inset:0;cursor:zoom-out}
.close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;color:#fff;font-size:28px;line-height:1;pointer-events:none}

/* Search and From filters. */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tools input{flex:1 1 220px;max-width:360px;font:inherit;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.filter{font:inherit;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--surface);cursor:pointer}
.filter span{color:var(--muted);margin-left:4px}
.filter[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.filter[aria-pressed="true"] span{color:inherit;opacity:.8}
.empty{color:var(--muted);padding:24px 0}
@media (max-width:639px){.tools input{flex-basis:100%;max-width:none}}
/* From along the top of each tile, the description along the bottom. */
.tile{position:relative}
.tile .from,.tile .desc{position:absolute;left:0;right:0;padding:6px 8px;color:#fff;font:600 12px/1.25 var(--body);text-align:left;text-shadow:0 1px 2px rgba(0,0,0,.5);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.tile .from{top:0;background:linear-gradient(rgba(0,0,0,.55),transparent);letter-spacing:.04em}
.tile .desc{bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.65));font-weight:500;padding-top:14px}
@media (min-width:640px){.tile .from,.tile .desc{font-size:14px;padding:8px 10px}}
.details b{display:block;font-size:14px;letter-spacing:.06em;opacity:.75;margin-bottom:2px}

<script>
// Rows come from the sheet's eyes tab (headings in its top row: from, image, description; see TABS in sync.py),
// with each row's high-resolution photo in DATA.photos and its thumbnail in images.json, both keyed by row.
const DATA = JSON.parse(document.getElementById('sheet-data').textContent);
const col = name => (DATA.columns || []).findIndex(c => String(c).trim().toLowerCase() === name);
const FROM = col('from'), DESC = col('description');
const sentence = s => s.charAt(0).toUpperCase() + s.slice(1);
// A From cell can name several places, separated by commas or semicolons. Each is shown as typed in the sheet;
// the same place typed with different capitals is spelled the way it first appears, so it's one filter.
const spelling = {};
const places = s => [...new Set(s.split(/[,;\n]+/).map(p => p.trim()).filter(Boolean)
  .map(p => spelling[p.toLowerCase()] ??= p))];
const items = (DATA.rows || []).map((r, i) => {
  const from = places(FROM >= 0 ? String(r[FROM] || '') : '');
  const desc = sentence(DESC >= 0 ? String(r[DESC] || '').trim() : '');
  return { i, from, desc, hay: (from.join(' ') + ' ' + desc).toLowerCase() };
});

const grid = document.getElementById('grid'), viewer = document.getElementById('viewer'), big = document.getElementById('big');
const details = document.getElementById('details'), sub = document.getElementById('sub'), empty = document.getElementById('empty');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
const photo = it => DATA.photos?.[it.i] ? '../' + DATA.photos[it.i].src : '';

for (const it of items) {
  const li = el('li'), b = el('button', 'tile');
  b.type = 'button';
  it.img = el('img');
  it.img.alt = it.desc || it.from.join(', ');
  it.img.loading = 'lazy';
  it.img.decoding = 'async';
  it.img.hidden = true;  // until it has a photo
  b.append(it.img);
  if (it.from.length) b.append(el('span', 'from', it.from.join(' · ')));
  if (it.desc) b.append(el('span', 'desc', it.desc));
  b.addEventListener('click', () => {
    const src = photo(it) || it.img.src;
    if (src) big.src = src; else big.removeAttribute('src');
    details.replaceChildren();
    if (it.from.length) details.append(el('b', '', it.from.join(' · ')));
    if (it.desc) details.append(it.desc);
    details.hidden = !it.from.length && !it.desc;
    viewer.showModal();
  });
  li.append(b);
  grid.append(li);
  it.li = li;
}

// From filters: each place is a toggle; with several on, an eye from any of them shows.
const on = new Set();
const counts = {};
items.forEach(it => it.from.forEach(p => counts[p] = (counts[p] || 0) + 1));
const tools = document.getElementById('tools');
for (const p of Object.keys(counts).sort()) {
  const b = el('button', 'filter', p);
  b.type = 'button';
  b.setAttribute('aria-pressed', 'false');
  b.append(el('span', '', String(counts[p])));
  b.addEventListener('click', () => {
    on.has(p) ? on.delete(p) : on.add(p);
    b.setAttribute('aria-pressed', String(on.has(p)));
    update();
  });
  tools.append(b);
}
const q = document.getElementById('q');
q.addEventListener('input', update);

function update() {
  const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  for (const it of items) {
    const ok = (!on.size || it.from.some(p => on.has(p))) && words.every(w => it.hay.includes(w));
    it.li.hidden = !ok;
    shown += ok;
  }
  empty.hidden = shown > 0 || !items.length;
  sub.textContent = !items.length ? 'No eyes yet: they come from the sheet\u2019s eyes tab.'
    : shown === items.length ? `${items.length} eye${items.length === 1 ? '' : 's'}` : `Showing ${shown} of ${items.length} eyes`;
}
update();

// Thumbnails load as one file; any tile without one falls back to its high-resolution photo.
fetch('images.json').then(r => r.ok ? r.json() : {}, () => ({})).then(thumbs => {
  for (const it of items) { const src = thumbs[it.i] || photo(it); if (src) { it.img.src = src; it.img.hidden = false; } }
});
viewer.addEventListener('close', () => big.removeAttribute('src'));
</script>
